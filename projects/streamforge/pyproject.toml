[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streamforge"
version = "0.1.0"
description = "Real-time event ingestion and analytics platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2", "boto3>=1.34,<2", "confluent-kafka>=2.5,<3", "fastapi>=0.115,<1",
  "pandas>=2.2,<3", "prometheus-client>=0.21,<1", "psycopg[binary]>=3.2,<4",
  "pyarrow>=18,<24", "pydantic>=2.9,<3", "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3", "uvicorn[standard]>=0.32,<1"
]
[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "ruff>=0.8,<1", "httpx>=0.27,<1"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
