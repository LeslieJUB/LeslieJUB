name: StreamForge CI

on:
  push:
    paths:
      - "projects/streamforge/**"
      - ".github/workflows/streamforge-ci.yml"
  pull_request:
    paths:
      - "projects/streamforge/**"
      - ".github/workflows/streamforge-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: streamforge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/streamforge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/streamforge/pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check --select E,F --ignore E501 .
      - name: Unit and reliability tests
        run: pytest -q
      - name: Dependency vulnerability audit
        run: |
          python -m pip install pip-audit
          pip-audit --strict
