name: StreamForge CI
on:
  push:
    paths:
      - "projects/streamforge/**"
      - ".github/workflows/streamforge-ci.yml"
  pull_request:
    paths:
      - "projects/streamforge/**"
      - ".github/workflows/streamforge-ci.yml"
  workflow_dispatch:
jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/streamforge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/streamforge/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
